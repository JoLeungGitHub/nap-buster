name: Deploy landing

# NapBuster's landing page — Cloudflare Pages project `napbuster-landing`,
# serving napbuster.joleu.ng (proxied by the joleu-ng worker's
# SUBDOMAIN_ROUTES table). The rest of the repo is the Pebble watch app, which
# is built with pebble-tool and installed to a watch, so only docs/ changes
# trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-napbuster-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Fail fast and legibly if the deploy credential is absent, rather
      # than surfacing a bare wrangler "Authentication error [10000]".
      - name: Require CLOUDFLARE_API_TOKEN
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set for this repo."
            echo "Add it with:"
            echo "  gh secret set CLOUDFLARE_API_TOKEN --repo \$GITHUB_REPOSITORY"
            exit 1
          fi
        # Runs from the repo root regardless of any job-level working-directory.
        working-directory: .
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No build step — a single self-contained index.html plus screenshots.
      # Gate on the entry point and its images existing, since the page 404s
      # visibly if the img/ directory goes missing.
      - name: Check landing files
        run: |
          test -f docs/index.html
          test -d docs/img

      - name: Deploy to Pages
        run: >-
          npx wrangler pages deploy docs
          --project-name=napbuster-landing
          --branch=main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account IDs are identifiers, not secrets — this one is already
          # committed in wrangler.toml across the joleu.ng repos.
          CLOUDFLARE_ACCOUNT_ID: 4a2deedf1d4c6412c7fdd95e1bec50df
